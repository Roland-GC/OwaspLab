name: DevSecOps Secure CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security_scans:
    name: Run Security Audits
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el código del repositorio en la máquina virtual de GitHub
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0 # Necesario para que TruffleHog revise el historial completo

      # 2. Análisis del código fuente (SAST) con Semgrep
      - name: SAST Scan (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config=auto --error

      # 3. Análisis de dependencias (SCA) con npm audit
      # Como usas Node/Vite, esto buscará componentes vulnerables u obsoletos
      - name: Setup Node.js Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: SCA Dependency Scan (npm audit)
        run: |
          npm ci # Instalación limpia de dependencias
          npm audit --audit-level=high # Falla el flujo si hay vulnerabilidades Altas/Críticas

      - name: Production Build
        run: npm run build

      # 4. Escaneo de Secretos Expuestos (Secret Scanning) con TruffleHog
      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@ddc015e5ed99942b2253d8ea16a0586a01ef2ab1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified # Evita falsos positivos comprobando si las keys son reales
